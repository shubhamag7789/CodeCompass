name: 🐞 Bug Report
description: Report a problem with CodeCompass
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I run `codecompass analyze .`, ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands and, if possible, a minimal example repository or file.
      placeholder: |
        1. python -m codecompass analyze .
        2. python -m codecompass serve
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output / traceback
      description: Paste any error output. This is automatically formatted as code.
      render: shell
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version` (CodeCompass requires 3.11+).
      placeholder: "3.11.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 14 / Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: llm
    attributes:
      label: Were you using the optional OpenRouter integration?
      options:
        - "No — local / offline mode"
        - "Yes — OPENROUTER_API_KEY was set"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I re-ran `analyze` so the analysis/index are up to date.
          required: false
        - label: I searched existing issues and this is not a duplicate.
          required: true
