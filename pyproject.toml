[project]
name = "codecompass"
version = "0.2.0"
description = "AI-powered developer onboarding and codebase intelligence platform."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shubham Agarwal", email = "shubhamagarwal47910@gmail.com" }]
keywords = [
    "code-analysis",
    "codebase",
    "architecture",
    "dependency-graph",
    "developer-tools",
    "onboarding",
    "static-analysis",
    "code-search",
    "ast",
    "tree-sitter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Documentation",
    "Operating System :: OS Independent",
]
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/shubhamag7789/CodeCompass"
Repository = "https://github.com/shubhamag7789/CodeCompass"

[project.scripts]
codecompass = "codecompass.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codecompass*"]

[tool.setuptools.package-data]
codecompass = ["storage/schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
